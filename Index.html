<!DOCTYPE html>
<html>
  <head>
    <title>HTML Forms</title>
  </head>
  <body>
    <h1>Form Example</h1>
    <br>
    <form>
      <fieldset>
        <legend>Practice Form</legend>
        <fieldset>
          <label for="entry_name">Name:</label>
          <input type="text" id="entry_name" name="entry_name" maxlength="20">
          <br>
          <label for="secret">Secret Key:</label>
          <input type="Password" name="Secret" id="Secret" size="15" maxlength="10" required>
        </fieldset>
        <br>
        <fieldset>
          <label for="year">Year:</label>
          <select id="year" name="year">
          <option value="freshman">Freshman</option>
          <option value="sophomore">Sophomore</option>
          <option value="junior">Junior</option>
          <option value="senior">Senior</option>
          </select>
        </fieldset>
        <br>
        <label for="colors">Colors:</label>
        <select id="color" name="color" multiple>
        <option value="white">White</option>
        <option value="blue">Blue</option>
        <option value="black">Black</option>
        <option value="red">Red</option>
        <option value="green">Green</option>
        </select>
      
      <br>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">M</label>
      <br>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">F</label>
      <br>

      <input type="radio" id="yes" name="yesno" value="True">
      <label for="yes">Y</label>
      <input type="radio" id="no" name="yesno" value="False">
      <label for="no">N</label>
      <br>
      <br>

      
      <input type="checkbox" id="required" name="required" value="required">
      <label for="required">This class is required</label>
      <br>
      <input type="checkbox" id="interest" name="interest" value="interest">
      <label for="required">Interest for this class</label>
      <br>
  
      <input type="submit" value="Submit">
      
    </fieldset>
    </form>
  </body>
</html>
